# Profil prod : PostgreSQL. On surcharge explicitement le driver et le
# dialecte, sinon ceux d H2 definis dans application.properties restent
# actifs et Hibernate refuse de demarrer ("Driver org.h2.Driver claims
# to not accept jdbcUrl, jdbc:postgresql://...").
spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:5432/${DB_NAME:tlprice}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:tlprice}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# En prod, aucun repli sur localhost : si la variable est absente, la valeur
# reste vide et EnableBankingService refuse d ouvrir une autorisation avec un
# message explicite. Un renvoi vers localhost apres authentification bancaire
# est invisible cote serveur et incomprehensible cote utilisateur — mieux vaut
# echouer avant d envoyer l utilisateur chez sa banque.
tlprice.redirect-url=${TLPRICE_REDIRECT_URL:}

# Raspberry Pi : 1 Go de RAM partage avec PostgreSQL. Le pool par defaut
# (10 connexions) est surdimensionne pour une app personnelle ; chaque
# connexion coute ~10 Mo cote PostgreSQL.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Le cookie de session ne part qu en HTTPS (Cloudflare / Caddy devant).
# TLPRICE_COOKIE_SECURE=false uniquement pour tester en http sur le reseau local.
server.servlet.session.cookie.secure=${TLPRICE_COOKIE_SECURE:true}
