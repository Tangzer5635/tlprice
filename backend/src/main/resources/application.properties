server.port=8081
spring.application.name=tlprice

# Base de donnees par defaut : H2 fichier (zero config pour le developpement)
spring.datasource.url=jdbc:h2:file:./data/tlprice;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Derriere un reverse proxy (Caddy/Nginx), respecter X-Forwarded-*
server.forward-headers-strategy=framework

# Upload de la cle privee .pem
spring.servlet.multipart.max-file-size=32KB
spring.servlet.multipart.max-request-size=64KB

# --- Configuration tlprice ---
# Cle de chiffrement AES-256 (base64, 32 octets). Si vide, une cle est
# generee et stockee dans ./data/cle.secret au premier demarrage.
tlprice.cle-chiffrement=${TLPRICE_CLE_CHIFFREMENT:}

# URL de callback que CHAQUE utilisateur doit declarer dans SON application
# Enable Banking (champ "Allowed redirect URLs").
# Valeur de DEVELOPPEMENT. Le profil prod la surcharge sans defaut : si
# TLPRICE_REDIRECT_URL manque en prod, l app le dit au lieu de renvoyer
# silencieusement la banque vers localhost (v4).
tlprice.redirect-url=${TLPRICE_REDIRECT_URL:https://localhost:5173/banque/callback}

tlprice.enablebanking.base-url=https://api.enablebanking.com

# --- Mail (optionnel : sans ces variables, le recap email est desactive) ---
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
# From du recap (par defaut : username SMTP)
tlprice.mail.from=${MAIL_FROM:${MAIL_USERNAME:noreply@tlprice.local}}

# --- Web Push (notifications iPhone / navigateur) ---
# Genere une paire de cles une seule fois, puis garde-la :
#     npx web-push generate-vapid-keys
# Si ces variables sont absentes, le push est simplement desactive.
tlprice.vapid.cle-publique=${TLPRICE_VAPID_CLE_PUBLIQUE:}
tlprice.vapid.cle-privee=${TLPRICE_VAPID_CLE_PRIVEE:}
# Adresse de contact exigee par la norme VAPID (mailto: ou https:).
tlprice.vapid.sujet=${TLPRICE_VAPID_SUJET:mailto:contact@tlprice.local}

# --- Duree de la connexion (v3) ---
# Un cookie signe garde la connexion ouverte pendant N heures, meme apres
# fermeture de la PWA ou redemarrage du conteneur. Au-dela, mot de passe.
# La signature depend de TLPRICE_CLE_CHIFFREMENT : changer cette cle
# invalide tous les cookies emis.
tlprice.connexion.duree-heures=${TLPRICE_CONNEXION_DUREE_HEURES:48}

# --- Sauvegarde automatique (v3) ---
# Chaque nuit a 3h15, une copie JSON de chaque compte est ecrite ici, au
# meme format que l export manuel. Les plus anciennes sont purgees.
# Le repertoire doit etre DANS le volume Docker (/app/data), sinon la
# sauvegarde disparait a chaque redeploiement.
tlprice.sauvegarde.repertoire=${TLPRICE_SAUVEGARDE_REPERTOIRE:./data/sauvegardes}
tlprice.sauvegarde.retention=${TLPRICE_SAUVEGARDE_RETENTION:30}

# --- Actuator : uniquement /actuator/health, sans detail ---
# Le healthcheck Docker a besoin de savoir si l app repond, pas de publier
# l etat de la base et les variables d environnement sur Internet.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoints.web.discovery.enabled=false

# L indicateur SMTP est desactive (v4.0.1). Sans ca, spring.mail.host defini
# mais vide fait echouer une connexion SMTP a chaque sonde, la sante globale
# bascule a DOWN, l endpoint renvoie 503 et Docker marque le conteneur en
# echec — alors que l application repond normalement. Un serveur mail
# injoignable n est pas une raison de redemarrer l app.
management.health.mail.enabled=false

# Groupes liveness / readiness. Le healthcheck Docker vise "liveness", qui
# ne dit qu une chose : le processus tourne. Viser la sante globale ferait
# redemarrer l app en boucle si PostgreSQL tombait, alors qu un redemarrage
# n y changerait rien.
management.endpoint.health.probes.enabled=true

# --- Inscription ---
# L app est exposee sur Internet : fermee par defaut. Le tout premier compte
# reste toujours possible (base vide). Mettre a true le temps d inviter
# quelqu un, puis revenir a false.
tlprice.inscription.ouverte=${TLPRICE_INSCRIPTION_OUVERTE:false}

# --- Cookies ---
# Lax : le retour de la banque (navigation de premier niveau) garde la session,
# mais aucun site tiers ne peut poster avec tes cookies.
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# Arret propre : docker stop laisse finir les requetes en cours au lieu de
# couper une synchronisation bancaire au milieu.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
