<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>tlprice — combien il te reste vraiment</title>
    <meta
      name="description"
      content="Ton solde projete, malgre le retard d affichage de ta banque."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="tlprice" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1613" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applique le theme AVANT le premier paint pour eviter le flash.
      // Au premier lancement on suit la preference du systeme au lieu
      // d imposer le theme sombre.
      (function () {
        var t = localStorage.getItem("tlprice-theme");
        if (!t) {
          t = window.matchMedia("(prefers-color-scheme: light)").matches
            ? "clair"
            : "sombre";
        }
        document.documentElement.setAttribute("data-theme", t);
        // La barre du navigateur suit le theme choisi dans l app.
        var couleur = t === "clair" ? "#ffffff" : "#0f1613";
        var balises = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < balises.length; i++) {
          balises[i].setAttribute("content", couleur);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
